name: Publish site
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch site files (private repo, read-only key)
        uses: actions/checkout@v4
        with:
          repository: AusomeA/cvc-bwgg-site-src
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          path: site
          persist-credentials: false
      - name: Drop git metadata
        run: rm -rf site/.git
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
